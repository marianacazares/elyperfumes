<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogos form- ely</title>
    <link rel="stylesheet" href="style.css?v=2.5">
    <link rel="shortcut icon" href="./images/ely-emblem.png" type="image/x-icon">
</head>
<body>
<div class="formulario-catalogo-container">
            <div id="catalogo-form">
                <div class="form-group">
                    <label for="nombrePerfume">Nombre de perfume</label>
                    <input type="text" id="nombrePerfume">
                </div>
                <div class="form-group">
                    <label for="casaAroma">Casa de Aroma</label>
                    <input type="text" id="casaAroma">
                </div>
                <div class="form-group">
                    <label for="genero">Género</label>
                    <input type="text" id="genero">
                </div>
                <div class="form-group">
                    <label for="descripcion">Precio</label>
                    <input type="text" id="precio">
                </div>
                 <div class="form-group">
                    <label for="tipoAroma">Tipo de aroma</label>
                    <input type="text" id="tipoAroma">
                </div>
                <button id="enviar" class="btn btn-dark">Enviar</button>
            </div>
        </div>
</body>
</html>
